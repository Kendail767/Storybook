<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Hidden Waterfall - Tata Duende's Curse</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="story" id="story-text">
            Loading...
        </div>
        <div class="choices" id="choices-area">
        </div>
        <div class="inventory">
            <h3>Your Inventory</h3>
            <ul id="inventory-list"></ul>
        </div>
    </div>
    <script src="../js/game.js"></script>
    <script>
        loadGame();
        
        const urlParams = new URLSearchParams(window.location.search);
        const dogChoice = urlParams.get('dog');
        const storyDiv = document.getElementById('story-text');
        const choicesDiv = document.getElementById('choices-area');
        
        // handle dog outcome first
        if (dogChoice === 'black') {
            storyDiv.innerHTML = '<p>The black dog leads you eagerly. Too eagerly. You barely notice the path growing narrower, the edge growing closer. Suddenly, the dog vanishes and you\'re standing at the edge of a cliff, one step from falling.</p><p>You scramble back, heart pounding. Below, rocks wait.</p><p>After catching your breath, you find your way back to the path. Dawn is breaking. You continue your journey, shaken but alive.</p>';
            gameState.protection = (gameState.protection || 1) - 2;
            saveGame();
        } else if (dogChoice === 'white') {
            storyDiv.innerHTML = '<p>The white dog leads you safely through the dark. Every time you stumble, it waits. Every time you\'re afraid, it presses close. By dawn, you reach a beautiful waterfall, hidden in a valley. The dog licks your hand once, then disappears into the sunrise.</p>';
            gameState.protection = (gameState.protection || 1) + 2;
            saveGame();
        } else {
            storyDiv.innerHTML = '<p>You sit perfectly still as the dogs watch. Hours pass. Just before dawn, both dogs stand, sniff the air, and trot away together into the forest. As the sun rises, you see the path clearly and find your way to a hidden waterfall.</p>';
        }
        
        // now add the waterfall arrival text
        storyDiv.innerHTML += '<hr><p>You\'ve found it. Hidden in a valley surrounded by ferns and orchids, water tumbles into a crystal pool. Rainbows dance in the spray. It\'s the most beautiful place you\'ve ever seen.</p><p>Sitting on a rock by the pool is a small figure. No more than three feet tall. Enormous hat. Backwards feet. No thumbs.</p><p>Tata Duente.</p><p>He watches you with ancient eyes. Then grins.</p><p>"Well. You made it. Most don\'t."</p><p>He hops off the rock, walks toward you.</p><p>"Now we talk. You come about the village curse, yes?"</p><p>He sits on a rock and waits for your answer.</p>';
        
        // check what items the player has
        let hasJade = gameState.inventory.includes('jade figurine');
        let hasPersonalItem = gameState.inventory.includes('locket') || gameState.inventory.includes('photo') || gameState.wisdom >= 1;
        let hasVillageItem = gameState.visitedLocations.includes('church') && gameState.visitedLocations.includes('cemetery');
        let favor = gameState.tataDuenteFavor || 0;
        
        // BUILD THE CHOICES BASED ON WHAT PLAYER HAS
        let choicesHtml = '<p><strong>What do you offer Tata Duente?</strong></p>';
        
        // Option 1: Give back the jade
        if (hasJade) {
            choicesHtml += '<a href="#" onclick="giveJadeOnly()" class="btn">Give back the jade figurine (His)</a>';
        }
        
        // Option 2: Offer something personal
        choicesHtml += '<a href="#" onclick="givePersonal()" class="btn">Offer something personal (Yours)</a>';
        
        // Option 3: Show village proof
        if (hasVillageItem) {
            choicesHtml += '<a href="#" onclick="giveVillage()" class="btn">Offer proof the village cares (Theirs)</a>';
        }
        
        // Option 4: Give ALL THREE (if they have all)
        if (hasJade && hasPersonalItem && hasVillageItem) {
            choicesHtml += '<hr><a href="#" onclick="giveAllThree()" class="btn" style="background-color:#b57d4a;">★ GIVE ALL THREE OFFERINGS ★</a>';
        }
        
        // Option 5: Challenge him (always available)
        choicesHtml += '<hr><a href="#" onclick="challengeTata()" class="btn">Challenge Tata Duente (The curse is too harsh!)</a>';
        
        // Option 6: Go back
        choicesHtml += '<a href="jungle-path.html" class="btn">Return to the jungle (give up)</a>';
        
        choicesDiv.innerHTML = choicesHtml;
        updateInventoryDisplay();
        
        // ========== FUNCTION DEFINITIONS ==========
        
        window.giveJadeOnly = function() {
            let idx = gameState.inventory.indexOf('jade figurine');
            if (idx !== -1) gameState.inventory.splice(idx, 1);
            saveGame();
            storyDiv.innerHTML = '<p>Tata Duente takes the figurine gently. "Mine. Good. But where is yours? Where is theirs?" He shakes his head. "Not enough. Go back. Bring more. The curse stays."</p><p>He disappears into the waterfall mist.</p>';
            choicesDiv.innerHTML = '<a href="village-morning.html" class="btn">Return to village</a><br><a href="bad-ending.html" class="btn">Give up and leave the village forever</a>';
            updateInventoryDisplay();
        };
        
        window.givePersonal = function() {
            storyDiv.innerHTML = '<p>You reach into your pocket and pull out something precious to you. You offer it to Tata Duente.</p><p>He examines it quietly. "Yours. I feel your loss. Good. But the village must also give. Go. Bring their offering. Then we finish."</p>';
            gameState.tataDuenteFavor = (gameState.tataDuenteFavor || 0) + 1;
            gameState.wisdom = (gameState.wisdom || 0) + 1;
            saveGame();
            choicesDiv.innerHTML = '<a href="village-morning.html" class="btn">Return to village for their offering</a>';
        };
        
        window.giveVillage = function() {
            storyDiv.innerHTML = '<p>You show Tata Duente the proof that the village still remembers and cares - the cross from the church, the soil from the cemetery.</p><p>He nods slowly. "They remember. Good. But you must also give something of yours. And you must return what was taken. Come back with all three, and we finish this."</p>';
            gameState.tataDuenteFavor = (gameState.tataDuenteFavor || 0) + 1;
            saveGame();
            choicesDiv.innerHTML = '<a href="village-morning.html" class="btn">Return to village</a>';
        };
        
        window.giveAllThree = function() {
            // remove jade from inventory
            let jadeIdx = gameState.inventory.indexOf('jade figurine');
            if (jadeIdx !== -1) gameState.inventory.splice(jadeIdx, 1);
            
            storyDiv.innerHTML = '<p>You place:</p><ul><li>The jade figurine (his)</li><li>Something precious from your pocket (yours)</li><li>Proof from the church and cemetery (theirs)</li></ul><p>Tata Duente is silent for a long moment. Then he nods.</p><p>"Respect. Sacrifice. Community. You understand what my grandmother taught me." He stands, sprinkles water from the pool over the offerings. "The curse lifts at dawn. Tell your village - respect the forest. Respect the old ways. Or next time, I won\'t test their children. I\'ll take them."</p><p>He grins, but his eyes are kind. "You did well. Go home. And take this."</p><p>He hands you a small ceiba seedling.</p><p>"Plant it where the old one fell. Let the village care for it. Teach them why."</p>';
            
            gameState.curseActive = false;
            gameState.tataDuenteFavor = (gameState.tataDuenteFavor || 0) + 3;
            saveGame();
            
            // check if favor is high enough for secret ending
            if (gameState.tataDuenteFavor >= 4) {
                choicesDiv.innerHTML = '<a href="secret-ending.html" class="btn">Receive your reward (Secret Ending)</a>';
            } else {
                choicesDiv.innerHTML = '<a href="good-ending.html" class="btn">Return to the village (Good Ending)</a>';
            }
            updateInventoryDisplay();
        };
        
        window.challengeTata = function() {
            storyDiv.innerHTML = '<p>"This curse is too harsh! The village didn\'t cut the tree - one fool did, and he\'s already dead. Why punish everyone?"</p><p>Tata Duente stares. Then, slowly, he laughs.</p><p>"Bold. Stupid. But bold." He scratches his chin. "You speak truth. One fool caused this. But the village forgot the old ways. They stopped teaching their children about the forest. That\'s why the fool didn\'t know not to cut my tree."</p><p>He considers.</p><p>"I\'ll make new deal. You teach. You make sure the village remembers. Tell the stories. Keep the old ways alive. Do this, and I lift the curse."</p>';
            gameState.wisdom = (gameState.wisdom || 0) + 2;
            gameState.tataDuenteFavor = (gameState.tataDuenteFavor || 0) + 1;
            saveGame();
            choicesDiv.innerHTML = '<a href="teaching-ending.html" class="btn">Agree to teach the village</a><br><a href="bad-ending.html" class="btn">Refuse and abandon the village</a>';
        };
    </script>
</body>
</html>
